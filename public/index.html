<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes Tâches</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; color: #17171c; }
    h1 { color: #5c2483; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input { flex: 1; padding: .5rem; font-size: 1rem; }
    button { padding: .5rem 1rem; font-size: 1rem; background: #5c2483; color: #fff; border: 0; border-radius: .4rem; }
    li { padding: .4rem 0; border-bottom: 1px solid #e3e3e8; list-style: none; }
  </style>
</head>
<body>
  <h1>Mes Tâches</h1>
  <form id="formulaire">
    <input id="texte" name="texte" placeholder="Nouvelle tâche" aria-label="Nouvelle tâche">
    <button type="submit">Ajouter</button>
  </form>
  <ul id="liste"></ul>
  <script>
    const liste = document.getElementById('liste');
    async function afficher() {
      const taches = await fetch('/api/taches').then((r) => r.json());
      liste.innerHTML = '';
      for (const tache of taches) {
        const li = document.createElement('li');
        li.textContent = tache.texte;
        liste.appendChild(li);
      }
    }
    document.getElementById('formulaire').addEventListener('submit', async (e) => {
      e.preventDefault();
      const champ = document.getElementById('texte');
      await fetch('/api/taches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texte: champ.value }),
      });
      champ.value = '';
      afficher();
    });
    afficher();
  </script>
</body>
</html>
